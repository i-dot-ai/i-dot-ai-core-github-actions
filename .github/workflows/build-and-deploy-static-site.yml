name: Build and deploy static site

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
      COMMIT_HASH:
        required: true
        type: string
      SITE_PREFIX:
        description: "S3 key prefix for this site (must match the key in core-static-site sites.yaml). Defaults to the calling repository's name."
        required: false
        type: string
      EC2_INSTANCE_TYPE:
        required: false
        type: string
        default: "t3.large"
      RUNNER_SIZE:
        required: false
        type: string
        default: "large"
      NODE_VERSION:
        description: "Node.js version to use for building the static site"
        required: false
        type: string
        default: "latest"
      INSTALL_COMMAND:
        description: "Command to install dependencies"
        required: false
        type: string
        default: "cd frontend && npm install"
      BUILD_COMMAND:
        description: "Command to build the static site"
        required: false
        type: string
        default: "cd frontend && npm run build"
      BUILD_DIRECTORY:
        description: "Path to the built static site output directory"
        required: false
        type: string
        default: "frontend/dist"
    secrets:
      AWS_GITHUBRUNNER_PAT:
        required: true
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      DESTINATION_BUCKET:
        description: "The S3 bucket name for deploying the static site"
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      CLOUDFRONT_DISTRIBUTION_ID:
        description: "CloudFront distribution ID for cache invalidation after deployment"
        required: false
      BUILD_ENV_VARS:
        description: "Optional newline-separated KEY=VALUE pairs to write to a .env file before building"
        required: false

jobs:
  start-runner:
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/start-runner.yml@main
    with:
      EC2_INSTANCE_TYPE: ${{ inputs.EC2_INSTANCE_TYPE }}
      RUNNER_SIZE: ${{ inputs.RUNNER_SIZE }}
      ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
    secrets:
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

  build-and-deploy:
    runs-on: ${{ needs.start-runner.outputs.label }}
    needs:
      - start-runner
    environment: ${{ inputs.ENVIRONMENT }}
    env:
      BUILD_ENV_VARS: ${{ secrets.BUILD_ENV_VARS }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.COMMIT_HASH }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.NODE_VERSION }}

      - name: Create .env file
        if: ${{ env.BUILD_ENV_VARS != '' }}
        run: |
          echo "${{ secrets.BUILD_ENV_VARS }}" >> .env
        shell: bash

      - name: Install dependencies
        run: ${{ inputs.INSTALL_COMMAND }}
        shell: bash

      - name: Build static site
        run: ${{ inputs.BUILD_COMMAND }}
        shell: bash

      - name: AWS Authentication
        uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/authenticate-aws@main
        with:
          ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Sync to S3
        run: |
          aws s3 sync ${{ inputs.BUILD_DIRECTORY }} s3://${{ secrets.DESTINATION_BUCKET }}/${{ inputs.SITE_PREFIX || github.event.repository.name }}/ --delete
        shell: bash

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/${{ inputs.SITE_PREFIX || github.event.repository.name }}/*"
        shell: bash

  determine-success:
    needs:
      - start-runner
      - build-and-deploy
    runs-on: ${{ needs.start-runner.outputs.label }}
    if: always()
    outputs:
      success: ${{ steps.success.outputs.success }}
    steps:
      - id: success
        run: |
          if [[ "${{ needs.build-and-deploy.result }}" == "success" ]]; then
              echo "success=true" >> $GITHUB_OUTPUT
          else
              echo "success=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  notify-slack:
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/slack-notify.yml@main
    needs:
      - start-runner
      - build-and-deploy
      - determine-success
    if: always()
    with:
      RUNNER_LABEL: ${{ needs.start-runner.outputs.label }}
      WORKFLOW_PASSED: ${{ needs.determine-success.outputs.success == 'true' }}
      SUCCESS_PAYLOAD: "{\"blocks\":[{\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\":airplane: ${{ github.repository }} - Static site deployed to ${{ inputs.ENVIRONMENT }} :large_green_circle:\"}},{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"${{ inputs.COMMIT_HASH }} successfully deployed to ${{ inputs.ENVIRONMENT }}\"}}]}"
      FAILURE_PAYLOAD: "{\"blocks\":[{\"type\":\"header\",\"text\":{\"type\":\"plain_text\",\"text\":\":x: ${{ github.repository }} - Static site deploy to ${{ inputs.ENVIRONMENT }} failed :x:\"}},{\"type\":\"section\",\"text\":{\"type\":\"mrkdwn\",\"text\":\"${{ inputs.COMMIT_HASH }} failed to deploy to ${{ inputs.ENVIRONMENT }}\"}}]}"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  stop-runner:
    uses: i-dot-ai/i-dot-ai-core-github-actions/.github/workflows/stop-runner.yml@main
    if: needs.start-runner.outputs.use-persisted == 0 && always()
    needs:
      - start-runner
      - build-and-deploy
      - determine-success
      - notify-slack
    with:
      RUNNER_LABEL: ${{ needs.start-runner.outputs.label }}
      EC2_INSTANCE_ID: ${{ needs.start-runner.outputs.ec2-instance-id }}
      ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
    secrets:
      AWS_GITHUBRUNNER_PAT: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
