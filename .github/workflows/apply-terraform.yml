name: Release instance

on:
  workflow_call:
    inputs:
      APP_NAME:
        required: true
        type: string
      RUNNER_LABEL:
        required: true
        type: string
      PUBLIC_INFRA_DEPLOYMENT:
        required: true
        type: boolean
      ENVIRONMENT:
        required: false
        default: prod
        type: string
      INFRASTRUCTURE_FOLDER:
        required: false
        default: "infrastructure"
        type: string
      INFRA_CONFIG_REPO:
        required: false
        type: string
      CORE_INFRA_REF:
        type: string
        required: false
        default: refs/heads/main
      INFRA_CONFIG_REF:
        type: string
        required: false
        default: refs/heads/main
      IMAGE_TAG:
        type: string
        required: false
      TF_TARGET:
        type: string
        required: false
      ECR_REPO:
          type: string
          required: false
      ARTIFACTS_PATH:
        description: 'An optional path from which to download build artifacts'
        required: false
        type: string
      ENABLE_HEALTHCHECK: # deprecated, but needs to remain to ensure backwards compatibility for existing consumers.
        description: 'Deprecated: only works for apps with a single ECS service. Declare an ecs_services_to_await Terraform output instead; see docs/await-ecs-services.md'
        required: false
        default: false
        type: boolean
      TAG_IMAGE:
        description: 'Whether to tag a container image with the deployment environment. Set to false for repos without container images.'
        required: false
        default: true
        type: boolean
      TF_FILE:
        description: "Path to the .tf file containing the required_version constraint"
        required: false
        type: string
      USE_OIDC: # now obsolete, but needs to remain to ensure backwards compatibility for existing consumers.
        required: false
        type: boolean
        default: true
    secrets:
      AWS_GITHUBRUNNER_PAT:
        required: true
      AWS_GITHUBRUNNER_PAT_USER:
        required: true
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      AWS_GITHUBRUNNER_USER_ACCESS_KEY: # now obsolete, but needs to remain to ensure backwards compatibility for existing consumers.
        required: false
      AWS_GITHUBRUNNER_USER_SECRET_ID: # now obsolete, but needs to remain to ensure backwards compatibility for existing consumers.
        required: false

jobs:
  release-terraform:
    if: github.repository == 'i-dot-ai/${{ github.repository }}'
    runs-on: ${{ inputs.RUNNER_LABEL }}
    environment: ${{ inputs.ENVIRONMENT }}

    permissions:
      id-token: write
      contents: read

    steps:

    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: main

    - name: Dump inputs context
      env:
        INPUTS: ${{ toJSON(inputs) }}
      run: echo "$INPUTS"

    - name: Set global git credentials
      run: git config --global url.https://${{ secrets.AWS_GITHUBRUNNER_PAT }}@github.com/.insteadOf https://github.com/

    - name: AWS Authentication
      uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/authenticate-aws@main
      with:
        APP_NAME: ${{ inputs.APP_NAME }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    - name: Checkout i-ai-core-infrastructure
      uses: actions/checkout@v4
      with:
        repository: i-dot-ai/i-ai-core-infrastructure
        ref: ${{ inputs.CORE_INFRA_REF }}
        token: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
        path: i-ai-core-infrastructure

    - name: Optionally checkout terraform config variables for public repos
      if: ${{ inputs.PUBLIC_INFRA_DEPLOYMENT == true }}
      uses: actions/checkout@v4
      with:
        repository: i-dot-ai/${{ inputs.INFRA_CONFIG_REPO }}
        ref: ${{ inputs.INFRA_CONFIG_REF }}
        token: ${{ secrets.AWS_GITHUBRUNNER_PAT }}
        path: ${{ inputs.INFRA_CONFIG_REPO }}

    - name: Checkout
      uses: actions/checkout@v4
      with:
          path: main

    - name: Optionally Download Artifacts
      if: ${{ inputs.ARTIFACTS_PATH != '' }}
      uses: actions/download-artifact@v4
      with:
        name: artifacts
        path: main/${{ inputs.ARTIFACTS_PATH }}

    - name: Login to Amazon ECR
      if: ${{ inputs.TAG_IMAGE == true }}
      run: |
        aws ecr get-login-password | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      shell: bash

    - name: Parse Terraform version
      if: ${{ inputs.TF_FILE != '' }}
      id: parse_version
      uses: ukhsa-collaboration/devops-github-actions/.github/actions/parse-terraform-version@ea0aa2a80fccfb2a19e1c71443a0a60b85f618a8
      with:
        tf_file: ${{ inputs.TF_FILE }}

    - name: Setup Terraform
      if: ${{ inputs.TF_FILE != '' }}
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.parse_version.outputs.tf_version }}
        terraform_wrapper: false

    - name: Terraform init
      env:
        INFRASTRUCTURE_FOLDER: ${{ inputs.INFRASTRUCTURE_FOLDER }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
      run: |
        cd main
        if [[ $INFRASTRUCTURE_FOLDER ]]; then
          make tf_init infrastructure_folder=${{inputs.INFRASTRUCTURE_FOLDER}} env=$ENVIRONMENT
        else
          make tf_init env=$ENVIRONMENT
        fi

    # Lets the ECS health check recognise failures and rollbacks caused by this apply
    - name: Record when the apply started
      id: apply-started
      run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Terraform apply
      env:
        INFRASTRUCTURE_FOLDER: ${{ inputs.INFRASTRUCTURE_FOLDER }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
        TF_TARGET: ${{ inputs.TF_TARGET }}
        TF_LOGS: "INFO"
        TF_CLI_ARGS: "-no-color"
      run: |
        cd main
        tfParams=()
        [[ $INFRASTRUCTURE_FOLDER ]] && tfParams+=( "INFRASTRUCTURE_FOLDER=$INFRASTRUCTURE_FOLDER" )
        tfParams+=( "env=$ENVIRONMENT" )
        make tf_set_or_create_workspace "${tfParams[@]}"
        if [[ $IMAGE_TAG ]]; then
          make tf_auto_apply IMAGE_TAG=$IMAGE_TAG "${tfParams[@]}" > tf_apply_log.log # TODO: mask any sensitive values
        elif [[ $TF_TARGET ]]; then
          make tf_auto_apply TF_TARGET=$TF_TARGET "${tfParams[@]}" > tf_apply_log.log # TODO: mask any sensitive values
        else
          make tf_auto_apply "${tfParams[@]}" > tf_apply_log.log # TODO: mask any sensitive values
        fi

    # Apps opt in by providing a `tf_output` make target and an `ecs_services_to_await` output,
    # a list of { cluster, service, timeout_seconds?, stable_seconds? }. Apps without either keep
    # the previous behaviour.
    - name: Read ECS services to await
      id: services-to-await
      env:
        INFRASTRUCTURE_FOLDER: ${{ inputs.INFRASTRUCTURE_FOLDER }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        ENABLE_HEALTHCHECK: ${{ inputs.ENABLE_HEALTHCHECK }}
        TF_CLI_ARGS: "-no-color"
      run: |
        # Once an app provides tf_output it has opted in, so failing to read its services must fail
        # the release rather than silently skip the check
        cant_read() {
          echo "::error title=Could not read ECS services to await::$1. Terraform has applied, but the release cannot confirm the new version started."
          [[ -n "${2:-}" ]] && echo "$2"
          exit 1
        }

        not_waiting() {
          if [[ $ENABLE_HEALTHCHECK == true ]]; then
            echo 'No services listed in an `ecs_services_to_await` Terraform output, so falling back to the deprecated ENABLE_HEALTHCHECK check.'
          else
            echo "Not waiting for ECS services: $1."
            echo 'This release will be marked successful as soon as Terraform has applied, without checking that the new version started.'
            echo 'To wait for your services, see https://github.com/i-dot-ai/i-dot-ai-core-github-actions/blob/main/docs/await-ecs-services.md'
          fi
        }

        cd main
        if ! make -n tf_output > /dev/null 2>&1; then
          not_waiting 'this repository does not say which services to wait for (it has no `tf_output` make target)'
          exit 0
        fi
        tfParams=()
        [[ $INFRASTRUCTURE_FOLDER ]] && tfParams+=( "INFRASTRUCTURE_FOLDER=$INFRASTRUCTURE_FOLDER" )
        tfParams+=( "env=$ENVIRONMENT" )
        errors=$(mktemp)
        if ! services=$(make -s --no-print-directory tf_output output=ecs_services_to_await "${tfParams[@]}" 2> "$errors"); then
          # Repos sharing one Makefile across several Terraform folders may not declare the output in every folder
          if grep -q 'Output "ecs_services_to_await" not found' "$errors"; then
            not_waiting 'no `ecs_services_to_await` Terraform output is declared'
            exit 0
          fi
          cant_read 'make tf_output failed' "$(cat "$errors")"
        fi

        if ! jq -e 'type == "array"' <<< "$services" > /dev/null 2>&1; then
          cant_read 'the `ecs_services_to_await` Terraform output is not a list' "$services"
        fi
        count=$(jq length <<< "$services")
        if (( count == 0 )); then
          not_waiting 'the `ecs_services_to_await` Terraform output is an empty list'
          exit 0
        fi
        (( count == 1 )) && noun=service || noun=services
        echo "Found $count ECS $noun to wait for: $(jq -r 'map(.service) | join(", ")' <<< "$services")"
        echo "services=$(jq -c . <<< "$services")" >> "$GITHUB_OUTPUT"

    - name: await-infra
      if: ${{ inputs.ENABLE_HEALTHCHECK == true || steps.services-to-await.outputs.services != '' }}
      uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/ecs-healthcheck@main
      with:
        APP_NAME: ${{ inputs.APP_NAME }}
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        SERVICES: ${{ steps.services-to-await.outputs.services }}
        APPLY_STARTED_AT: ${{ steps.apply-started.outputs.at }}

    - name: Copy terraform logs to s3
      if: always()
      env:
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        APP_NAME: ${{ inputs.APP_NAME }}
      run: |
        cd main
        FILENAME=$APP_NAME/$(date +\%H-\%M-%d-%m-%Y)-$(git rev-parse HEAD).log
        aws s3 cp tf_apply_log.log "s3://i-dot-ai-$ENVIRONMENT-github-runner-logs/${FILENAME}"

    - name: Tag built image with deployment environment
      if: ${{ inputs.TF_TARGET == '' && inputs.TAG_IMAGE == true }}
      env:
        ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
        APP_NAME: ${{ inputs.APP_NAME }}
        INFRASTRUCTURE_FOLDER: ${{ inputs.INFRASTRUCTURE_FOLDER }}
        ECR_REPO: ${{ inputs.ECR_REPO }}
        IMAGE_TAG: ${{ inputs.IMAGE_TAG }}
      run: |
        if [[ $INFRASTRUCTURE_FOLDER ]]; then
          cd main
          if [[ $IMAGE_TAG ]]; then
            make docker_update_tag tag=$ENVIRONMENT IMAGE_TAG=$IMAGE_TAG
          elif [[ $ECR_REPO ]]; then
            echo "Processing $ECR_REPO"
            IFS=',' read -ra ECR_REPO <<< "$ECR_REPO"
            for repo in "${ECR_REPO[@]}"; do
              echo "Tagging service: $repo"
              make docker_update_tag tag=$ENVIRONMENT repo=$repo
            done
          else
            make docker_update_tag tag=$ENVIRONMENT
          fi
        fi