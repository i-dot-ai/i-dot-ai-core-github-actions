name: Modular Release

# Thin reusable workflow exposing a workflow_call interface for the
# modular-release composite action. Consumers reference this reusable workflow.
on:
  workflow_call:
    inputs:
      modules-manifest:
        description: 'Path to modules.yml relative to the repository root'
        type: string
        required: false
        default: 'modules.yml'
      language:
        description: "One of 'python', 'node', 'terraform'"
        type: string
        required: true
      packages-dir:
        description: 'Directory containing per-module packages'
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Directory to run all commands in (defaults to repo root)'
        type: string
        required: false
        default: '.'
      node-version:
        type: string
        required: false
        default: '20'
      pnpm-version:
        type: string
        required: false
        default: '9'
      python-version:
        type: string
        required: false
        default: '3.12'
      repo-url:
        description: 'Consumer repo URL (defaults to caller)'
        type: string
        required: false
        default: ''
      dry-run:
        description: "When 'true', runs semantic-release in dry-run mode (no tags, no publish)"
        type: boolean
        required: false
        default: false
      pre-release-branch:
        description: "Branch name to use as a pre-release channel (publishes pre-release versions with a non-latest dist-tag)"
        type: string
        required: false
        default: ''
    secrets:
      registry-token:
        description: 'NPM_TOKEN for Node, PYPI_TOKEN for Python, empty for Terraform'
        required: false
      github-token:
        description: 'GITHUB_TOKEN with contents:write to push the release commit and tag'
        required: true
    outputs:
      released-modules:
        description: 'JSON array of released modules with version and tag'
        value: ${{ jobs.release.outputs.released-modules }}
      failed-modules:
        description: 'JSON array of modules that failed publish'
        value: ${{ jobs.release.outputs.failed-modules }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      released-modules: ${{ steps.run.outputs.released-modules }}
      failed-modules: ${{ steps.run.outputs.failed-modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: true
          token: ${{ secrets.github-token }}

      - name: Run modular-release
        id: run
        uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/modular-release@EN-1535/modular-release-actions
        with:
          modules-manifest: ${{ inputs.modules-manifest }}
          language: ${{ inputs.language }}
          packages-dir: ${{ inputs.packages-dir }}
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          python-version: ${{ inputs.python-version }}
          repo-url: ${{ inputs.repo-url }}
          registry-token: ${{ secrets.registry-token }}
          github-token: ${{ secrets.github-token }}
          dry-run: ${{ inputs.dry-run }}
          pre-release-branch: ${{ inputs.pre-release-branch }}
