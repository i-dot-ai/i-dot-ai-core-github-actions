name: Modular Release

# Thin reusable workflow exposing a workflow_call interface for the
# modular-release composite action. Consumers reference this reusable workflow.
on:
  workflow_call:
    inputs:
      modules-manifest:
        description: 'Path to modules.yml relative to the repository root'
        type: string
        required: false
        default: 'modules.yml'
      language:
        description: "One of 'python', 'node', 'terraform'"
        type: string
        required: true
      packages-dir:
        description: >
          Directory that directly contains every module package. When empty,
          nested manifest keys form each module's package path.
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Consumer directory in which release commands run'
        type: string
        required: false
        default: '.'
      node-version:
        description: 'Node.js version used to run semantic-release'
        type: string
        required: false
        default: '22'
      pnpm-version:
        description: >
          pnpm version for Node consumers. Leave empty to read the version from
          the consumer's package.json "packageManager" field; set a value only
          for consumers without a packageManager pin (passing both errors under
          pnpm/action-setup v6).
        type: string
        required: false
        default: ''
      python-version:
        description: 'Python version used for Python consumers'
        type: string
        required: false
        default: '3.12'
      repo-url:
        description: 'Consumer repo URL (defaults to caller)'
        type: string
        required: false
        default: ''
      dry-run:
        description: >
          When 'true', runs semantic-release in dry-run mode (no tags, no
          publish, no commits). The Node package smoke test is skipped, so a
          dry run does not exercise the published artifact.
        type: boolean
        required: false
        default: false
      pre-release-branch:
        description: "Branch name to use as a pre-release channel (publishes pre-release versions with a non-latest dist-tag)"
        type: string
        required: false
        default: ''
    secrets:
      registry-token:
        description: 'Registry publish token for Node or Python; omit for Terraform'
        required: false
      github-token:
        description: 'GitHub token with contents:write for release commits, tags, and releases'
        required: true
    outputs:
      released-modules:
        description: >
          JSON array of { module, version, tag } objects. A dry run reports the
          literal string 'dry-run' for both version and tag.
        value: ${{ jobs.release.outputs.released-modules }}
      failed-modules:
        description: 'JSON array of { module, error } objects that failed release'
        value: ${{ jobs.release.outputs.failed-modules }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      id-token: write
    outputs:
      released-modules: ${{ steps.run.outputs.released-modules }}
      failed-modules: ${{ steps.run.outputs.failed-modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Change detection diffs HEAD against its first parent, which a
          # single-commit checkout cannot resolve.
          fetch-depth: 2
          persist-credentials: true
          token: ${{ secrets.github-token }}

      - name: Run modular-release
        id: run
        uses: i-dot-ai/i-dot-ai-core-github-actions/.github/actions/modular-release@main
        with:
          modules-manifest: ${{ inputs.modules-manifest }}
          language: ${{ inputs.language }}
          packages-dir: ${{ inputs.packages-dir }}
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          python-version: ${{ inputs.python-version }}
          repo-url: ${{ inputs.repo-url }}
          registry-token: ${{ secrets.registry-token }}
          github-token: ${{ secrets.github-token }}
          dry-run: ${{ inputs.dry-run }}
          pre-release-branch: ${{ inputs.pre-release-branch }}
