name: 'Modular Release'
description: >
  Releases independently versioned modules from a shared repository using
  module-scoped conventional commits. Supports node, python, and terraform
  consumers.

inputs:
  modules-manifest:
    description: 'Path to modules.yml relative to the repository root'
    required: false
    default: 'modules.yml'
  language:
    description: "One of 'python', 'node', 'terraform'"
    required: true
  packages-dir:
    description: >
      Directory that directly contains every module package. When empty,
      nested manifest keys form each module's package path.
    required: false
    default: ''
  working-directory:
    description: 'Consumer directory in which release commands run'
    required: false
    default: '.'
  node-version:
    description: 'Node.js version used to run semantic-release'
    required: false
    default: '22'
  pnpm-version:
    description: >
      pnpm version (Node consumers only). Leave empty to let pnpm/action-setup
      read the version from the consumer's package.json "packageManager" field;
      passing both a version here and a packageManager pin errors under
      action-setup v6. Set a value only for consumers without a packageManager
      pin.
    required: false
    default: ''
  python-version:
    description: 'Python version (Python consumers only)'
    required: false
    default: '3.12'
  registry-token:
    description: 'Registry publish token for Node or Python; omit for Terraform'
    required: false
    default: ''
  github-token:
    description: 'GitHub token with contents:write for release commits, tags, and releases'
    required: true
  repo-url:
    description: >
      Consumer repository URL embedded in the generated semantic-release config.
      Defaults to the GitHub server URL plus the calling repository.
    required: false
    default: ''
  dry-run:
    description: >
      Stringified boolean. Only the literal 'true' enables dry-run mode, in
      which semantic-release makes no tags, commits, or publishes. The Node
      package smoke test is skipped, so a dry run does not exercise the
      published artifact. Composite action inputs are always strings; the
      reusable workflow exposes this as a boolean and GitHub stringifies it.
    required: false
    default: 'false'
  pre-release-branch:
    description: >
      When set, adds the named branch as a pre-release channel in the
      semantic-release config. Publishes will use a pre-release version
      (e.g. 1.0.0-my-branch.1) and a non-latest npm dist-tag. Leave empty
      for production releases from main.
    required: false
    default: ''

outputs:
  released-modules:
    description: >
      JSON array of { module, version, tag } objects. A dry run reports the
      literal string 'dry-run' for both version and tag.
    value: ${{ steps.dispatch.outputs.released-modules }}
  failed-modules:
    description: 'JSON array of { module, error } objects that failed release'
    value: ${{ steps.dispatch.outputs.failed-modules }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: 'https://registry.npmjs.org'
        always-auth: true

    - name: Setup pnpm
      if: inputs.language == 'node'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        # Empty version lets action-setup read the consumer's packageManager
        # pin. Passing a non-empty version alongside a packageManager field
        # errors (ERR_PNPM_BAD_PM_VERSION), so only forward an explicit input.
        version: ${{ inputs.pnpm-version }}

    - name: Setup Python
      if: inputs.language == 'python'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup uv
      if: inputs.language == 'python'
      uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

    - name: Install codegen dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/codegen
      run: npm install --no-audit --no-fund --silent

    - name: Install consumer-repo release tooling
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LANGUAGE: ${{ inputs.language }}
      run: |
        # The consumer repo carries its own root package.json with semantic-release
        # and its plugins as devDependencies. For Node consumers this is part of
        # the workspace install. For Python and Terraform consumers we install
        # only the release tooling here.
        if [ "$LANGUAGE" = "node" ]; then
          pnpm install --frozen-lockfile
        else
          npm install --no-audit --no-fund --silent
        fi

    - name: Detect changed modules
      id: detect
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MANIFEST: ${{ inputs.modules-manifest }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
      run: |
        changed=$("${{ github.action_path }}/scripts/get_changed_modules.sh" "$MANIFEST" "$PACKAGES_DIR")
        echo "Changed modules: $changed"
        echo "modules=$changed" >> "$GITHUB_OUTPUT"

    - name: Generate per-module release configurations
      id: codegen
      if: steps.detect.outputs.modules != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        MANIFEST: ${{ inputs.modules-manifest }}
        LANGUAGE: ${{ inputs.language }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
        REPO_URL_INPUT: ${{ inputs.repo-url }}
        PRE_RELEASE_BRANCH: ${{ inputs.pre-release-branch }}
      run: |
        repo_url="$REPO_URL_INPUT"
        if [ -z "$repo_url" ]; then
          repo_url="${{ github.server_url }}/${{ github.repository }}"
        fi

        config_dir="${RUNNER_TEMP}/modular-release-config"
        mkdir -p "$config_dir"

        args=(
          --manifest "$MANIFEST"
          --template "$ACTION_PATH/codegen/templates/release.template.js"
          --output "$config_dir"
          --language "$LANGUAGE"
          --repo-url "$repo_url"
        )
        if [ -n "$PACKAGES_DIR" ]; then
          args+=(--packages-dir "$PACKAGES_DIR")
        fi
        if [ -n "$PRE_RELEASE_BRANCH" ]; then
          args+=(--pre-release-branch "$PRE_RELEASE_BRANCH")
        fi

        node "$ACTION_PATH/codegen/cli.js" "${args[@]}" > "$config_dir/generated.json"
        cat "$config_dir/generated.json"
        echo "config-dir=$config_dir" >> "$GITHUB_OUTPUT"

    - name: Release changed modules
      id: dispatch
      if: steps.detect.outputs.modules != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NPM_TOKEN: ${{ inputs.registry-token }}
        NODE_AUTH_TOKEN: ${{ inputs.registry-token }}
        UV_PUBLISH_TOKEN: ${{ inputs.registry-token }}
        LANGUAGE: ${{ inputs.language }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
        CONFIG_DIR: ${{ steps.codegen.outputs.config-dir }}
        CHANGED: ${{ steps.detect.outputs.modules }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -e

        dry_run_flag=""
        if [ "$DRY_RUN" = "true" ]; then
          echo "::notice::Running in dry-run mode — no tags, commits, or publishes will occur."
          dry_run_flag="--dry-run"
        fi

        released='[]'
        failed='[]'

        for module in $CHANGED; do
          echo "::group::Releasing $module"

          if [ "$LANGUAGE" = "node" ] && [ -n "$PACKAGES_DIR" ] && [ "$DRY_RUN" != "true" ]; then
            # Pre-publish smoke test: build, pack the module, install the tarball
            # into an empty environment, and require the package. Catches missing
            # runtime declarations that the workspace install masked.
            pkg_dir="$PACKAGES_DIR/$module"
            pkg_name=$(node -p "require('./$pkg_dir/package.json').name")
            pnpm --filter "$pkg_name" run build
            tarball=$(cd "$pkg_dir" && pnpm pack | tail -1)
            smoke_dir=$(mktemp -d)
            cp "$pkg_dir/$tarball" "$smoke_dir/"
            (cd "$smoke_dir" && npm init -y >/dev/null && npm install --no-audit --no-fund --silent "./$tarball" && node -e "require('$pkg_name')")
            echo "Smoke install passed for $pkg_name"
          fi

          if npx semantic-release $dry_run_flag --extends "$CONFIG_DIR/release.${module}.js"; then
            if [ "$DRY_RUN" = "true" ]; then
              released=$(
                RELEASED_JSON="$released" MODULE="$module" \
                node -e 'const a=JSON.parse(process.env.RELEASED_JSON); a.push({module:process.env.MODULE, version:"dry-run", tag:"dry-run"}); process.stdout.write(JSON.stringify(a));'
              )
            else
              # semantic-release exits successfully when no release is due, so
              # the tags at HEAD are what distinguish a release from a no-op.
              # Modules whose names are suffixes of one another would both
              # match here; the manifest's unique-name rule does not prevent it.
              mapfile -t head_tags < <(git tag --points-at HEAD)
              module_tags=()
              for candidate in "${head_tags[@]}"; do
                if [[ "$candidate" == v*-"$module" ]]; then
                  module_tags+=("$candidate")
                fi
              done

              if [ "${#module_tags[@]}" -eq 0 ]; then
                echo "::notice::No release was due for $module"
              elif [ "${#module_tags[@]}" -gt 1 ]; then
                failed=$(
                  FAILED_JSON="$failed" MODULE="$module" \
                  node -e 'const a=JSON.parse(process.env.FAILED_JSON); a.push({module:process.env.MODULE, error:"multiple release tags found at HEAD"}); process.stdout.write(JSON.stringify(a));'
                )
              else
                tag="${module_tags[0]}"
                version="${tag#v}"
                version="${version%-${module}}"
                released=$(
                  RELEASED_JSON="$released" MODULE="$module" VERSION="$version" TAG="$tag" \
                  node -e 'const a=JSON.parse(process.env.RELEASED_JSON); a.push({module:process.env.MODULE, version:process.env.VERSION, tag:process.env.TAG}); process.stdout.write(JSON.stringify(a));'
                )
              fi
            fi
          else
            failed=$(
              FAILED_JSON="$failed" MODULE="$module" \
              node -e 'const a=JSON.parse(process.env.FAILED_JSON); a.push({module:process.env.MODULE, error:"semantic-release failed"}); process.stdout.write(JSON.stringify(a));'
            )
          fi
          echo "::endgroup::"
        done

        echo "released-modules=$released" >> "$GITHUB_OUTPUT"
        echo "failed-modules=$failed" >> "$GITHUB_OUTPUT"

        # Surface a non-zero exit if any module failed, after attempting all of them.
        if [ "$failed" != "[]" ]; then
          echo "One or more module releases failed: $failed" >&2
          exit 1
        fi
