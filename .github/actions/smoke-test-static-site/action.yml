name: Smoke Test Static Site
description: >
  Runs generic smoke tests against a deployed static site (CloudFront + S3).
  Checks HTTP status codes, security headers, and S3 origin header stripping.
  Results are published as a GitHub Actions test summary.

inputs:
  site-url:
    description: "Base URL of the deployed static site (e.g. https://example.static.dev.i.ai.gov.uk)"
    required: true
  additional-urls:
    description: "Newline-separated list of additional URLs to check for HTTP 200"
    required: false
    default: ""
  expected-security-headers:
    description: "Comma-separated list of security headers that must be present in responses"
    required: false
    default: "strict-transport-security,content-security-policy,x-content-type-options,x-frame-options,referrer-policy,permissions-policy"
  propagation-delay:
    description: "Seconds to wait for CloudFront cache propagation before running tests"
    required: false
    default: "30"
  request-timeout:
    description: "Per-request timeout in seconds"
    required: false
    default: "15"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Wait for CloudFront propagation
      shell: bash
      env:
        PROPAGATION_DELAY: ${{ inputs.propagation-delay }}
      run: sleep $PROPAGATION_DELAY

    - name: Run smoke tests
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
        ADDITIONAL_URLS: ${{ inputs.additional-urls }}
        EXPECTED_SECURITY_HEADERS: ${{ inputs.expected-security-headers }}
        REQUEST_TIMEOUT: ${{ inputs.request-timeout }}
      run: >
        uv run
        --with-requirements ${{ github.action_path }}/requirements.txt
        python -m pytest
        ${{ github.action_path }}/smoke_tests/
        -v
        --tb=short
        --junitxml=smoke-test-results.xml

    - name: Publish test results
      if: always()
      uses: mikepenz/action-junit-report@d2ca1b6d1a693e887907d5a6889bb0e6fd6d1002
      with:
        report_paths: smoke-test-results.xml
        check_name: Smoke Tests
        fail_on_failure: false
